apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecom-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nuruzzaman24x/ecommerce-backend.git
    targetRevision: main
    path: k8s-infra-manifest
  destination:
    server: https://kubernetes.default.svc
    namespace: ecom
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
