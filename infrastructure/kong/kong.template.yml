_format_version: "3.0"
_transform: true

consumers:
  - username: ecom-platform
    jwt_secrets:
      - key: "${JWT_ISSUER}"
        algorithm: RS256
        rsa_public_key: |
${JWT_PUBLIC_KEY_INDENTED}

services:
  - name: auth-service
    url: http://auth-service:3001
    retries: 3
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: auth-anonymous
        paths:
          - /api/v1/auth/register
          - /api/v1/auth/login
          - /api/v1/auth/refresh
          - /api/v1/auth/password/forgot
          - /api/v1/auth/password/reset
          - /api/v1/auth/.well-known
        strip_path: false
        preserve_host: true
        methods: [GET, POST, OPTIONS]
      - name: auth-protected
        paths:
          - /api/v1/auth
        strip_path: false
        preserve_host: true
      - name: auth-internal-blocked
        paths:
          - /api/v1/auth/internal
        strip_path: false

  - name: admin-service
    url: http://admin-service:3002
    retries: 3
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: admin-protected
        paths:
          - /api/v1/admin
        strip_path: false
        preserve_host: true
      - name: admin-internal-blocked
        paths:
          - /api/v1/admin/internal
        strip_path: false

  - name: public-service
    url: http://public-service:3003
    retries: 3
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: public-catalog
        paths:
          - /api/v1/public/catalog
        strip_path: false
        preserve_host: true
        methods: [GET, OPTIONS]
      - name: public-protected
        paths:
          - /api/v1/public
        strip_path: false
        preserve_host: true
      - name: public-internal-blocked
        paths:
          - /api/v1/public/internal
        strip_path: false

plugins:
  ### Prometheus plugin: Kong-er metrics (request rate, latency, status code)
  ### Kong-er status port 8100 er /metrics endpoint-e expose kore.
  ### Prometheus ei endpoint scrape kore, Grafana dashboard-e Kong traffic dekhay.
  - name: prometheus
    config:
      status_code_metrics: true   ### status code (2xx/4xx/5xx) onujayi request count
      latency_metrics: true   ### request, kong ar upstream latency
      bandwidth_metrics: true   ### request/response byte count
      upstream_health_metrics: true   ### upstream service-er health

  - name: correlation-id
    config:
      header_name: X-Request-Id
      generator: uuid
      echo_downstream: true

  - name: request-size-limiting
    config:
      allowed_payload_size: 1
      size_unit: megabytes

  - name: cors
    config:
      origins: ${CORS_ORIGINS_YAML}
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers:
        - Accept
        - Authorization
        - Content-Type
        - Idempotency-Key
        - X-Request-Id
        - X-Correlation-Id
      exposed_headers:
        - X-Request-Id
        - X-Correlation-Id
      credentials: true
      max_age: 3600
      preflight_continue: false

  - name: rate-limiting
    config:
      minute: ${RATE_LIMIT_PER_MINUTE}
      policy: local
      limit_by: ip
      fault_tolerant: true
      hide_client_headers: false

  - name: jwt
    route: auth-protected
    config:
      claims_to_verify: [exp]
      key_claim_name: iss
      run_on_preflight: false

  - name: jwt
    route: admin-protected
    config:
      claims_to_verify: [exp]
      key_claim_name: iss
      run_on_preflight: false

  - name: jwt
    route: public-protected
    config:
      claims_to_verify: [exp]
      key_claim_name: iss
      run_on_preflight: false

  - name: rate-limiting
    route: auth-anonymous
    config:
      minute: ${AUTH_RATE_LIMIT_PER_MINUTE}
      policy: local
      limit_by: ip
      fault_tolerant: true

  - name: request-termination
    route: auth-internal-blocked
    config:
      status_code: 404
      content_type: "application/json; charset=utf-8"
      body: '{"success":false,"error":{"code":"NOT_FOUND","message":"Not found","requestId":"gateway"}}'

  - name: request-termination
    route: admin-internal-blocked
    config:
      status_code: 404
      content_type: "application/json; charset=utf-8"
      body: '{"success":false,"error":{"code":"NOT_FOUND","message":"Not found","requestId":"gateway"}}'

  - name: request-termination
    route: public-internal-blocked
    config:
      status_code: 404
      content_type: "application/json; charset=utf-8"
      body: '{"success":false,"error":{"code":"NOT_FOUND","message":"Not found","requestId":"gateway"}}'
