apiVersion: apps/v1                             # Deployment-এর জন্য API সংস্করণ
kind: Deployment                                # ধরন: Deployment, পড চালু রাখা ও আপডেট করার দায়িত্বে
metadata:                                       # Deployment-এর পরিচয়
  name: admin-service                           # Deployment-এর নাম
spec:                                           # Deployment-এর বিবরণ
  replicas: 1                                   # কয়টা পড চলবে (এখানে ১টা)
  selector:                                     # কোন পডকে নিজের বলে চিনবে
    matchLabels:                                # label মিলিয়ে চেনা
      app: admin-service                        # app=admin-service লেবেলওয়ালা পড
  template:                                     # পডের নকশা শুরু
    metadata:                                   # পডের পরিচয়
      labels:                                   # পডে লাগানো label
        app: admin-service                      # Service এই label দেখে ট্রাফিক পাঠায়
      annotations:
        instrumentation.opentelemetry.io/inject-nodejs: "ecom-nodejs"
    spec:                                       # পডের বিবরণ
      enableServiceLinks: false                 # অন্য Service-এর env ভ্যারিয়েবল পডে ঢোকানো বন্ধ
      securityContext:                          # পডের স্তরের নিরাপত্তা সেটিং
        fsGroup: 1000                           # মাউন্ট করা ভলিউমের ফাইলের গ্রুপ ১০০০, যাতে অ্যাপ লিখতে পারে
      containers:                               # পডের ভেতরের container-এর তালিকা
      - name: admin-service                     # container-এর নাম
        image: nuruzzaman24x/ecom-admin:b7     # যে Docker image চালাবে (Docker Hub থেকে)
        imagePullPolicy: Always
        ports:                                  # container-এর দরজা
        - containerPort: 3002                   # container এই পোর্টে শোনে
        securityContext:                        # container-এর নিরাপত্তা সেটিং
          allowPrivilegeEscalation: false       # container-কে অতিরিক্ত অধিকার পাওয়া থেকে আটকায়
          readOnlyRootFilesystem: true          # container-এর মূল ফাইলসিস্টেম শুধু পড়া যাবে, লেখা যাবে না
          capabilities: {drop: [ALL]}           # Linux-এর সব বিশেষ ক্ষমতা কেড়ে নেয়, নিরাপত্তা বাড়ায়
        env:                                    # অ্যাপের এনভায়রনমেন্ট ভ্যারিয়েবলের তালিকা
        - name: NODE_OPTIONS
          value: "--enable-source-maps"
        - name: SERVICE_NAME                    # ভ্যারিয়েবলের নাম: সার্ভিসের পরিচয়
          value: admin-service                  # মান: লগে এই নামে দেখাবে
        - name: PORT                            # ভ্যারিয়েবলের নাম: অ্যাপ কোন পোর্টে শুনবে
          value: "3002"                         # মান: ৩০০২
        - name: DB_PASS                         # ভ্যারিয়েবলের নাম: ডাটাবেসের পাসওয়ার্ড
          valueFrom:                            # মান আসবে অন্য জায়গা থেকে
            secretKeyRef:                       # Secret থেকে (গোপন মান)
              name: ecom-secrets                # Secret-এর নাম
              key: ADMIN_DB_PASSWORD            # Secret-এর যে key-তে পাসওয়ার্ড আছে
        - name: DATABASE_URL                    # ভ্যারিয়েবলের নাম: ডাটাবেসের সংযোগ ঠিকানা
          value: "postgresql://admin_service:$(DB_PASS)@postgres:5432/ecommerce"   # ইউজার admin_service, পাসওয়ার্ড উপরের DB_PASS, host postgres, ডাটাবেস ecommerce
        - name: DATABASE_POOL_MAX               # ভ্যারিয়েবলের নাম: ডাটাবেস সংযোগের সর্বোচ্চ সংখ্যা
          value: "15"                           # মান: একসাথে সর্বোচ্চ ১৫টা সংযোগ
        - name: NODE_ENV                        # ভ্যারিয়েবলের নাম: চালানোর পরিবেশ
          value: production                     # মান: production মোড
        - name: LOG_LEVEL                       # ভ্যারিয়েবলের নাম: লগের বিস্তারিত স্তর
          value: info                           # মান: সাধারণ তথ্য-স্তরের লগ
        - name: LOG_PRETTY                      # ভ্যারিয়েবলের নাম: লগ সাজিয়ে দেখানো হবে কিনা
          value: "false"                        # মান: না, সাধারণ JSON লগ
        - name: API_PREFIX                      # ভ্যারিয়েবলের নাম: API ঠিকানার শুরুর অংশ
          value: api                            # মান: /api দিয়ে শুরু
        - name: API_VERSION                     # ভ্যারিয়েবলের নাম: API সংস্করণ
          value: v1                             # মান: v1, তাই ঠিকানা /api/v1/...
        - name: TRUST_PROXY                     # ভ্যারিয়েবলের নাম: প্রক্সির (Kong/ingress) পাঠানো তথ্য বিশ্বাস করবে কিনা
          value: "true"                         # মান: হ্যাঁ বিশ্বাস করবে
        - name: BODY_LIMIT                      # ভ্যারিয়েবলের নাম: অনুরোধের বডির সর্বোচ্চ আকার
          value: 512kb                          # মান: ৫১২ কিলোবাইট
        - name: SWAGGER_ENABLED                 # ভ্যারিয়েবলের নাম: API ডকুমেন্ট পেজ চালু থাকবে কিনা
          value: "false"                        # মান: না, বন্ধ
        - name: CORS_ORIGINS                    # ভ্যারিয়েবলের নাম: কোন ওয়েবসাইট সরাসরি এই সার্ভিস ডাকতে পারবে
          value: ""                             # মান: খালি, কারণ CORS Kong সামলায়
        - name: JWT_ISSUER                      # ভ্যারিয়েবলের নাম: টোকেন কে বানিয়েছে তার নাম
          value: ecom-auth                      # মান: ecom-auth
        - name: JWT_AUDIENCE                    # ভ্যারিয়েবলের নাম: টোকেন কাদের জন্য
          value: ecom-api                       # মান: ecom-api
        - name: REDIS_KEY_PREFIX                # ভ্যারিয়েবলের নাম: Redis-এর key-গুলোর শুরুর নাম
          value: ecom                           # মান: ecom, যাতে অন্য ডাটার সাথে না মেশে
        - name: CACHE_ENABLED                   # ভ্যারিয়েবলের নাম: ক্যাশ চালু থাকবে কিনা
          value: "true"                         # মান: হ্যাঁ, চালু
        - name: RABBITMQ_ENABLED                # ভ্যারিয়েবলের নাম: মেসেজ ব্রোকার ব্যবহার হবে কিনা
          value: "true"                         # মান: হ্যাঁ, চালু
        - name: RUN_MIGRATIONS                  # ভ্যারিয়েবলের নাম: চালুর সময় ডাটাবেসের টেবিল তৈরি হবে কিনা
          value: "true"                         # মান: হ্যাঁ, entrypoint.sh migration চালাবে
        - name: RUN_SEED                        # ভ্যারিয়েবলের নাম: চালুর সময় demo ডাটা ঢুকবে কিনা
          value: "false"                        # মান: না, demo ডাটা আলাদা Job-এ ঢোকে
        - name: JWT_PUBLIC_KEY                  # ভ্যারিয়েবলের নাম: টোকেন যাচাইয়ের প্রকাশ্য চাবি
          valueFrom:                            # মান আসবে অন্য জায়গা থেকে
            secretKeyRef:                       # Secret থেকে
              name: ecom-secrets                # Secret-এর নাম
              key: JWT_PUBLIC_KEY               # Secret-এর যে key-তে চাবি আছে
        - name: INTERNAL_API_KEY                # ভ্যারিয়েবলের নাম: সার্ভিসগুলোর নিজেদের মধ্যে কথা বলার গোপন চাবি
          valueFrom:                            # মান আসবে অন্য জায়গা থেকে
            secretKeyRef:                       # Secret থেকে
              name: ecom-secrets                # Secret-এর নাম
              key: INTERNAL_API_KEY             # Secret-এর যে key-তে চাবি আছে
        - name: REDIS_PASSWORD                  # ভ্যারিয়েবলের নাম: Redis-এর পাসওয়ার্ড
          valueFrom:                            # মান আসবে অন্য জায়গা থেকে
            secretKeyRef:                       # Secret থেকে
              name: ecom-secrets                # Secret-এর নাম
              key: REDIS_PASSWORD               # Secret-এর যে key-তে পাসওয়ার্ড আছে
        - name: RABBITMQ_USER                   # ভ্যারিয়েবলের নাম: RabbitMQ-এর ইউজারনেম
          valueFrom:                            # মান আসবে অন্য জায়গা থেকে
            secretKeyRef:                       # Secret থেকে
              name: ecom-secrets                # Secret-এর নাম
              key: RABBITMQ_USER                # Secret-এর যে key-তে ইউজারনেম আছে
        - name: RABBITMQ_PASSWORD               # ভ্যারিয়েবলের নাম: RabbitMQ-এর পাসওয়ার্ড
          valueFrom:                            # মান আসবে অন্য জায়গা থেকে
            secretKeyRef:                       # Secret থেকে
              name: ecom-secrets                # Secret-এর নাম
              key: RABBITMQ_PASSWORD            # Secret-এর যে key-তে পাসওয়ার্ড আছে
        - name: REDIS_URL                       # ভ্যারিয়েবলের নাম: Redis-এর সংযোগ ঠিকানা
          value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"   # পাসওয়ার্ড উপরের REDIS_PASSWORD, host redis, পোর্ট ৬৩৭৯, ডাটাবেস নম্বর ০
        - name: RABBITMQ_URL                    # ভ্যারিয়েবলের নাম: RabbitMQ-এর সংযোগ ঠিকানা, AMQP = Advanced Message Queuing Protocol।  এটা মেসেজ পাঠানো-নেওয়ার একটা নিয়ম (প্রোটোকল), যেমন ওয়েবসাইটের জন্য http://, তেমনি RabbitMQ-র সাথে কথা বলার জন্য amqp://।
          value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/%2F"   # ইউজার ও পাসওয়ার্ড উপরের মান, host rabbitmq, পোর্ট ৫৬৭২, vhost "/" (%2F)
        - name: AUTH_SERVICE_URL                # ভ্যারিয়েবলের নাম: auth-service-এর ঠিকানা
          value: "http://auth-service:3001"     # মান: ক্লাস্টারের ভেতরের ঠিকানা
        - name: INVOICE_STORAGE_DIR             # ভ্যারিয়েবলের নাম: ইনভয়েস ফাইল রাখার ফোল্ডার
          value: /app/storage/invoices          # মান: এই ফোল্ডারে ভলিউম মাউন্ট করা আছে
        - name: INVOICE_COMPANY_NAME            # ভ্যারিয়েবলের নাম: ইনভয়েসে কোম্পানির নাম
          value: "Aurelia Commerce Ltd"         # মান: কোম্পানির নাম
        - name: INVOICE_COMPANY_ADDRESS         # ভ্যারিয়েবলের নাম: ইনভয়েসে কোম্পানির ঠিকানা
          value: "House 42, Road 11, Banani, Dhaka 1213"   # মান: কোম্পানির ঠিকানা
        - name: INVOICE_COMPANY_EMAIL           # ভ্যারিয়েবলের নাম: ইনভয়েসে কোম্পানির ইমেইল
          value: "billing@aurelia.example"      # মান: বিলিংয়ের ইমেইল
        - name: INVOICE_COMPANY_REGISTRATION    # ভ্যারিয়েবলের নাম: ইনভয়েসে কোম্পানির নিবন্ধন নম্বর
          value: "UEN 202400123X"               # মান: নিবন্ধন নম্বর
        - name: INVOICE_CURRENCY                # ভ্যারিয়েবলের নাম: ইনভয়েসের মুদ্রা
          value: BDT                            # মান: বাংলাদেশি টাকা
        - name: INVOICE_TAX_RATE                # ভ্যারিয়েবলের নাম: কর হার
          value: "0"                            # মান: ০, মানে কর নেই
        - name: SHIPPING_FLAT_RATE              # ভ্যারিয়েবলের নাম: ডেলিভারি চার্জের নির্দিষ্ট হার
          value: "120"                          # মান: ১২০ টাকা
        - name: FREE_SHIPPING_THRESHOLD         # ভ্যারিয়েবলের নাম: বিনামূল্যে ডেলিভারির ন্যূনতম অর্ডার
          value: "5000"                         # মান: ৫০০০ টাকার বেশি হলে ডেলিভারি ফ্রি
        - name: OUTBOX_POLL_INTERVAL_MS         # ভ্যারিয়েবলের নাম: outbox টেবিল কত সময় পর পর দেখবে
          value: "1000"                         # মান: ১০০০ মিলিসেকেন্ড (১ সেকেন্ড)
        - name: OUTBOX_BATCH_SIZE               # ভ্যারিয়েবলের নাম: একবারে কয়টা মেসেজ পাঠাবে
          value: "50"                           # মান: ৫০টা
        volumeMounts:                           # কোন ভলিউম container-এর কোথায় বসবে
        - {name: tmp, mountPath: /tmp}          # tmp নামের অস্থায়ী ভলিউম /tmp-এ বসে, লেখার জায়গা
        - {name: invoices, mountPath: /app/storage/invoices}   # invoices ভলিউম ইনভয়েস ফোল্ডারে বসে, স্থায়ী ফাইল রাখতে
        readinessProbe:                         # "তুমি কাজের জন্য তৈরি?" পরীক্ষা
          httpGet: {path: /health/ready, port: 3002}   # এই ঠিকানায় HTTP অনুরোধ পাঠিয়ে দেখে
          initialDelaySeconds: 20               # চালুর ২০ সেকেন্ড পরে প্রথম পরীক্ষা
          periodSeconds: 10                     # প্রতি ১০ সেকেন্ডে পরীক্ষা
          failureThreshold: 12                  # পরপর ১২ বার ব্যর্থ হলে "তৈরি না"
        livenessProbe:                          # "তুমি বেঁচে আছো?" পরীক্ষা
          httpGet: {path: /health/ready, port: 3002}   # একই ঠিকানায় পরীক্ষা
          initialDelaySeconds: 90               # চালুর ৯০ সেকেন্ড পরে শুরু (migration-এর সময় দিতে)
          periodSeconds: 20                     # প্রতি ২০ সেকেন্ডে পরীক্ষা
          failureThreshold: 6                   # পরপর ৬ বার ব্যর্থ হলে পড রিস্টার্ট
        resources:                              # RAM-এর হিসাব
          requests: {cpu: 100m, memory: 128Mi}             # অন্তত ১২৮ MB দরকার (নোড বাছাইয়ের সময় ধরা হয়)
          limits: {memory: 512Mi}               # সর্বোচ্চ ৫১২ MB নিতে পারবে
      volumes:                                  # পডের ভলিউমের তালিকা
      - {name: tmp, emptyDir: {}}               # tmp: খালি অস্থায়ী ফোল্ডার, পড মুছলে মুছে যায়
      - name: invoices                          # ভলিউমের নাম invoices
        persistentVolumeClaim: {claimName: invoice-data}   # স্থায়ী ডিস্ক, নিচের invoice-data দাবি থেকে

---                                             # নতুন রিসোর্স শুরু
apiVersion: v1                                  # Service-এর জন্য Kubernetes API সংস্করণ
kind: Service                                   # ধরন: Service, অন্য পডগুলো এই নামে admin-service-কে ডাকে
metadata:                                       # Service-এর পরিচয়
  name: admin-service                           # Service-এর নাম, kong.rendered.yml-এ এই নামেই ঠিকানা দেওয়া আছে
spec:                                           # Service-এর বিবরণ
  selector:                                     # কোন পডে ট্রাফিক পাঠাবে তা বাছাই
    app: admin-service                          # যে পডে label app=admin-service আছে সেটিতে
  ports:                                        # দরজার তালিকা
    - port: 3002                                # Service-এর দরজা (অন্যরা এই পোর্টে ডাকে)
      targetPort: 3002                          # পডের ভেতরের পোর্ট, যেখানে অ্যাপ শোনে

---                                             # নতুন রিসোর্স শুরু
apiVersion: v1                                  # PVC-এর জন্য API সংস্করণ
kind: PersistentVolumeClaim                     # ধরন: স্থায়ী ডিস্কের দাবি
metadata:                                       # দাবির পরিচয়
  name: invoice-data                            # নাম invoice-data, উপরের Deployment এই নামে ডাকে
spec:                                           # দাবির বিবরণ
  storageClassName: nfs-client           # কোন ধরনের আলমারি (nfs-client = NFS server-এ data থাকে, Pod delete হলেও থাকে)
  accessModes: ["ReadWriteOnce"]                # একবারে একটা নোড থেকে পড়া ও লেখা যাবে
  resources:                                    # কতটা জায়গা লাগবে
    requests:                                   # চাওয়া
      storage: 1Gi                              # ১ GB


