### ArgoCD (Helm): ClusterIP + Ingress (https://argocd.local), TLS ingress-nginx-e shesh hoy.
global:
  domain: argocd.local

configs:
  params:
    server.insecure: true

server:
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argocd.local
    tls: true
    annotations:
      cert-manager.io/cluster-issuer: ecom-ca
