### ArgoCD Application: GitHub-এর k8s-manifest দেখে ecom namespace-এ নিজে apply করবে।
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecom-frontend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nuruzzaman24x/ecommerce-frontend.git
    targetRevision: main
    path: k8s-manifest
  destination:
    server: https://kubernetes.default.svc
    namespace: ecom
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
