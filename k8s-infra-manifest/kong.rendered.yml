_format_version: "3.0"
_transform: true

consumers:
  - username: ecom-platform
    jwt_secrets:
      - key: "ecom-auth"
        algorithm: RS256
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA6tatNzVdi3QpE8B/xWfC
          7PXEnGA6/1duyA7rxepuvfo13HyBAVUUPkMtn6tZ4m4X4PMVGoEf/k7rsDYT8OFW
          U2vqATBuWHW/KbN/N3aUJLpIrzkygbTKZoxAXioP0QvGuVstm5PfMZfA0PyNx4De
          GM0+On8oLuQk2LuVJoqzW/YRLh70DLkVQa33Avu+T3SQo/vm7tLQAlMpwYAzFHyH
          i93WQI6LTfxi0hpizY0KC+pZxwVTMORYO7wMh5u12XBrir4qluzsrHlhdBfMk3GA
          5TdJFU/J/EJEHskpWtGGsN8xt/R8Pe/FTAyBTuodJiWKCHOS/15VcRxAeRMl9Mr0
          jQIDAQAB
          -----END PUBLIC KEY-----

services:
  - name: auth-service
    url: http://auth-service:3001
    retries: 3
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: auth-anonymous
        paths:
          - /api/v1/auth/register
          - /api/v1/auth/login
          - /api/v1/auth/refresh
          - /api/v1/auth/password/forgot
          - /api/v1/auth/password/reset
          - /api/v1/auth/.well-known
        strip_path: false
        preserve_host: true
        methods: [GET, POST, OPTIONS]
      - name: auth-protected
        paths:
          - /api/v1/auth
        strip_path: false
        preserve_host: true
      - name: auth-internal-blocked
        paths:
          - /api/v1/auth/internal
        strip_path: false

  - name: admin-service
    url: http://admin-service:3002
    retries: 3
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: admin-protected
        paths:
          - /api/v1/admin
        strip_path: false
        preserve_host: true
      - name: admin-internal-blocked
        paths:
          - /api/v1/admin/internal
        strip_path: false

  - name: public-service
    url: http://public-service:3003
    retries: 3
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: public-catalog
        paths:
          - /api/v1/public/catalog
        strip_path: false
        preserve_host: true
        methods: [GET, OPTIONS]
      - name: public-protected
        paths:
          - /api/v1/public
        strip_path: false
        preserve_host: true
      - name: public-internal-blocked
        paths:
          - /api/v1/public/internal
        strip_path: false

plugins:
  - name: correlation-id
    config:
      header_name: X-Request-Id
      generator: uuid
      echo_downstream: true

  - name: request-size-limiting
    config:
      allowed_payload_size: 1
      size_unit: megabytes

  - name: cors
    config:
      origins: [http://shop.172.17.0.233.nip.io, http://admin.172.17.0.233.nip.io]
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers:
        - Accept
        - Authorization
        - Content-Type
        - Idempotency-Key
        - X-Request-Id
        - X-Correlation-Id
      exposed_headers:
        - X-Request-Id
        - X-Correlation-Id
      credentials: true
      max_age: 3600
      preflight_continue: false

  - name: rate-limiting
    config:
      minute: 300
      policy: local
      limit_by: ip
      fault_tolerant: true
      hide_client_headers: false

  - name: jwt
    route: auth-protected
    config:
      claims_to_verify: [exp]
      key_claim_name: iss
      run_on_preflight: false

  - name: jwt
    route: admin-protected
    config:
      claims_to_verify: [exp]
      key_claim_name: iss
      run_on_preflight: false

  - name: jwt
    route: public-protected
    config:
      claims_to_verify: [exp]
      key_claim_name: iss
      run_on_preflight: false

  - name: rate-limiting
    route: auth-anonymous
    config:
      minute: 20
      policy: local
      limit_by: ip
      fault_tolerant: true

  - name: request-termination
    route: auth-internal-blocked
    config:
      status_code: 404
      content_type: "application/json; charset=utf-8"
      body: '{"success":false,"error":{"code":"NOT_FOUND","message":"Not found","requestId":"gateway"}}'

  - name: request-termination
    route: admin-internal-blocked
    config:
      status_code: 404
      content_type: "application/json; charset=utf-8"
      body: '{"success":false,"error":{"code":"NOT_FOUND","message":"Not found","requestId":"gateway"}}'

  - name: request-termination
    route: public-internal-blocked
    config:
      status_code: 404
      content_type: "application/json; charset=utf-8"
      body: '{"success":false,"error":{"code":"NOT_FOUND","message":"Not found","requestId":"gateway"}}'

  - name: prometheus
    config:
      per_consumer: false
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true
