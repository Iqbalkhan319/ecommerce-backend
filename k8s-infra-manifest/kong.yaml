apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: ecom
  labels:
    app: kong
spec:
  selector:
    app: kong
  ports:
    - name: proxy
      port: 8000
      targetPort: 8000
    - name: admin-api
      port: 8001
      targetPort: 8001
    - name: manager
      port: 8002
      targetPort: 8002
    - name: status
      port: 8100
      targetPort: 8100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: ecom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      enableServiceLinks: false
      containers:
        - name: kong
          image: kong:3.9
          ports:
            - containerPort: 8000
            - containerPort: 8001
            - containerPort: 8002
            - containerPort: 8100
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/declarative/kong.yml
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000"
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:8001"
            - name: KONG_ADMIN_GUI_LISTEN
              value: "0.0.0.0:8002"
            - name: KONG_STATUS_LISTEN
              value: "0.0.0.0:8100"
            - name: KONG_ADMIN_GUI_URL
              value: "http://kong-manager.172.17.0.233.nip.io"
            - name: KONG_ADMIN_GUI_API_URL
              value: "http://kong-admin.172.17.0.233.nip.io"
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
            - name: KONG_LOG_LEVEL
              value: notice
            - name: KONG_NGINX_WORKER_PROCESSES
              value: "2"
          volumeMounts:
            - name: cfg
              mountPath: /kong/declarative/kong.yml
              subPath: kong.yml
              readOnly: true
          readinessProbe:
            exec:
              command:
                - kong
                - health
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - kong
                - health
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
          resources:
            requests:
              memory: 384Mi
            limits:
              memory: 1Gi
      volumes:
        - name: cfg
          configMap:
            name: kong-config
