### Elasticsearch (Helm): single-node, NFS storage, ClusterIP. Security chart-er default (TLS + elastic user).
replicas: 1
minimumMasterNodes: 1

esJavaOpts: "-Xms1g -Xmx1g"

resources:
  requests:
    cpu: "500m"
    memory: "2Gi"
  limits:
    cpu: "1000m"
    memory: "2Gi"

persistence:
  enabled: true

volumeClaimTemplate:
  accessModes: ["ReadWriteOnce"]
  storageClassName: "nfs-client"
  resources:
    requests:
      storage: 10Gi

antiAffinity: "soft"
clusterHealthCheckParams: "wait_for_status=yellow&timeout=1s"

service:
  type: ClusterIP
