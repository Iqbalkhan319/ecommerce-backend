### Kibana (Helm): Elasticsearch-er sathe connect, ClusterIP + HTTPS Ingress (kibana.local).
elasticsearchHosts: "https://elasticsearch-master:9200"

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

service:
  type: ClusterIP

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: ecom-ca
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: kibana.local
      paths:
        - path: /
  tls:
    - secretName: kibana-tls
      hosts:
        - kibana.local
