### Kibana (Helm): Elasticsearch-er sathe connect, ClusterIP + HTTPS Ingress (kibana.local).
elasticsearchHosts: "https://elasticsearch-master:9200"

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

service:
  type: ClusterIP

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: ecom-ca
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: kibana.local
      paths:
        - path: /
  tls:
    - secretName: kibana-tls
      hosts:
        - kibana.local

# Encryption key gulo Git-e na, secret `kibana-encryption-keys` theke ashe (namespace: logging)
extraEnvs:
  - name: XPACK_SECURITY_ENCRYPTIONKEY
    valueFrom: {secretKeyRef: {name: kibana-encryption-keys, key: security}}
  - name: XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY
    valueFrom: {secretKeyRef: {name: kibana-encryption-keys, key: saved}}
  - name: XPACK_REPORTING_ENCRYPTIONKEY
    valueFrom: {secretKeyRef: {name: kibana-encryption-keys, key: reporting}}
