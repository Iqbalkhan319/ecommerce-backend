### Kibana (Helm): Elasticsearch-er sathe connect, ClusterIP + Ingress (kibana.local).
elasticsearchHosts: "https://elasticsearch-master:9200"

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

service:
  type: ClusterIP

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: kibana.local
      paths:
        - path: /
