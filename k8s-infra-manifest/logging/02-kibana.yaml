### Kibana (ECK): efk Elasticsearch-er sathe auto-connect, NodePort-e expose.
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: efk
  namespace: logging
spec:
  version: 8.15.3
  count: 1
  elasticsearchRef:
    name: efk
  http:
    service:
      spec:
        type: NodePort
        ports:
          - port: 5601
            targetPort: 5601
            nodePort: 30601
  podTemplate:
    spec:
      containers:
        - name: kibana
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
