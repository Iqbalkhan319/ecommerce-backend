apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: ecom-pool
  namespace: metallb-system
spec:
  addresses:
    - 172.17.0.14-172.17.0.18
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: ecom-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - ecom-pool
