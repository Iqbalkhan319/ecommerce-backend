apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: ecom-ca
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
  - hosts: [jaeger.local]
    secretName: jaeger-tls
  rules:
  - host: jaeger.local
    http:
      paths:
      - {path: /, pathType: Prefix, backend: {service: {name: jaeger-ui, port: {number: 16686}}}}
