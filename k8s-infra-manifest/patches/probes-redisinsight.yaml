- op: add
  path: /spec/template/spec/containers/0/readinessProbe
  value:
    tcpSocket: {port: 5540}
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 3
- op: add
  path: /spec/template/spec/containers/0/livenessProbe
  value:
    tcpSocket: {port: 5540}
    initialDelaySeconds: 40
    periodSeconds: 20
    timeoutSeconds: 3
