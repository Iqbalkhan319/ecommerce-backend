apiVersion: v1
kind: Service
metadata:
  name: public-service
spec:
  selector:
    app: public-service
  ports:
    - port: 3003
      targetPort: 3003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: public-service
  template:
    metadata:
      labels:
        app: public-service
      annotations:
        instrumentation.opentelemetry.io/inject-nodejs: "ecom-nodejs"
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      containers:
      - name: public-service
        image: nuruzzaman24x/ecom-public:1.0
        imagePullPolicy: Always
        ports:
        - containerPort: 3003
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        env:
        - name: NODE_OPTIONS
          value: "--enable-source-maps"
        - {name: SERVICE_NAME, value: public-service}
        - {name: PORT, value: "3003"}
        - {name: DB_PASS, valueFrom: {secretKeyRef: {name: ecom-secrets, key: PUBLIC_DB_PASSWORD}}}
        - {name: DATABASE_URL, value: "postgresql://public_service:$(DB_PASS)@postgres:5432/ecommerce"}
        - {name: DATABASE_POOL_MAX, value: "15"}
        - {name: NODE_ENV, value: production}
        - {name: LOG_LEVEL, value: info}
        - {name: LOG_PRETTY, value: "false"}
        - {name: API_PREFIX, value: api}
        - {name: API_VERSION, value: v1}
        - {name: TRUST_PROXY, value: "true"}
        - {name: BODY_LIMIT, value: 512kb}
        - {name: SWAGGER_ENABLED, value: "false"}
        - {name: CORS_ORIGINS, value: ""}
        - {name: JWT_ISSUER, value: ecom-auth}
        - {name: JWT_AUDIENCE, value: ecom-api}
        - {name: REDIS_KEY_PREFIX, value: ecom}
        - {name: CACHE_ENABLED, value: "true"}
        - {name: RABBITMQ_ENABLED, value: "true"}
        - {name: RUN_MIGRATIONS, value: "true"}
        - {name: RUN_SEED, value: "false"}
        - {name: JWT_PUBLIC_KEY, valueFrom: {secretKeyRef: {name: ecom-secrets, key: JWT_PUBLIC_KEY}}}
        - {name: INTERNAL_API_KEY, valueFrom: {secretKeyRef: {name: ecom-secrets, key: INTERNAL_API_KEY}}}
        - {name: REDIS_PASSWORD, valueFrom: {secretKeyRef: {name: ecom-secrets, key: REDIS_PASSWORD}}}
        - {name: RABBITMQ_USER, valueFrom: {secretKeyRef: {name: ecom-secrets, key: RABBITMQ_USER}}}
        - {name: RABBITMQ_PASSWORD, valueFrom: {secretKeyRef: {name: ecom-secrets, key: RABBITMQ_PASSWORD}}}
        - {name: REDIS_URL, value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"}
        - {name: RABBITMQ_URL, value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/%2F"}
        - {name: ADMIN_SERVICE_URL, value: "http://admin-service:3002"}
        - {name: AUTH_SERVICE_URL, value: "http://auth-service:3001"}
        - {name: CATALOG_CACHE_TTL_SECONDS, value: "120"}
        volumeMounts:
        - {name: tmp, mountPath: /tmp}

        readinessProbe:
          httpGet: {path: /health/ready, port: 3003}
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          httpGet: {path: /health/ready, port: 3003}
          initialDelaySeconds: 90
          periodSeconds: 20
          failureThreshold: 6
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 512Mi}
      volumes:
      - {name: tmp, emptyDir: {}}

