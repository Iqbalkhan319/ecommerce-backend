apiVersion: v1
kind: Service
metadata:
  name: redisinsight
  namespace: ecom
spec:
  selector:
    app: redisinsight
  ports:
    - port: 5540
      targetPort: 5540
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redisinsight
  namespace: ecom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redisinsight
  template:
    metadata:
      labels:
        app: redisinsight
    spec:
      enableServiceLinks: false
      containers:
        - name: redisinsight
          image: redis/redisinsight:2.70
          ports:
            - containerPort: 5540
          env:
            - name: RI_APP_PORT
              value: "5540"
            - name: RI_REDIS_HOST
              value: redis
            - name: RI_REDIS_PORT
              value: "6379"
            - name: RI_REDIS_ALIAS
              value: ecom-cache
            - name: RI_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecom-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
