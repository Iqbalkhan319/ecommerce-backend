### SonarQube (Helm): Community Build, ClusterIP + Ingress (sonar.local). Passcode git-e nai, install-er somoy --set diye dewa hoy.
community:
  enabled: true

service:
  type: ClusterIP

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  hosts:
    - name: sonar.local
      path: /

persistence:
  enabled: true
  storageClass: nfs-client
  size: 10Gi

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    memory: 3Gi


