apiVersion: v1
kind: Service
metadata:
  name: admin-service
spec:
  selector:
    app: admin-service
  ports:
    - port: 3002
      targetPort: 3002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-service
  template:
    metadata:
      labels:
        app: admin-service
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      containers:
      - name: admin-service
        image: nuruzzaman24x/ecom-admin:1.0
        ports:
        - containerPort: 3002
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        env:
        - {name: SERVICE_NAME, value: admin-service}
        - {name: PORT, value: "3002"}
        - {name: DB_PASS, valueFrom: {secretKeyRef: {name: ecom-secrets, key: ADMIN_DB_PASSWORD}}}
        - {name: DATABASE_URL, value: "postgresql://admin_service:$(DB_PASS)@postgres:5432/ecommerce"}
        - {name: DATABASE_POOL_MAX, value: "15"}
        - {name: NODE_ENV, value: production}
        - {name: LOG_LEVEL, value: info}
        - {name: LOG_PRETTY, value: "false"}
        - {name: API_PREFIX, value: api}
        - {name: API_VERSION, value: v1}
        - {name: TRUST_PROXY, value: "true"}
        - {name: BODY_LIMIT, value: 512kb}
        - {name: SWAGGER_ENABLED, value: "false"}
        - {name: CORS_ORIGINS, value: ""}
        - {name: JWT_ISSUER, value: ecom-auth}
        - {name: JWT_AUDIENCE, value: ecom-api}
        - {name: REDIS_KEY_PREFIX, value: ecom}
        - {name: CACHE_ENABLED, value: "true"}
        - {name: RABBITMQ_ENABLED, value: "true"}
        - {name: RUN_MIGRATIONS, value: "true"}
        - {name: RUN_SEED, value: "false"}
        - {name: JWT_PUBLIC_KEY, valueFrom: {secretKeyRef: {name: ecom-secrets, key: JWT_PUBLIC_KEY}}}
        - {name: INTERNAL_API_KEY, valueFrom: {secretKeyRef: {name: ecom-secrets, key: INTERNAL_API_KEY}}}
        - {name: REDIS_PASSWORD, valueFrom: {secretKeyRef: {name: ecom-secrets, key: REDIS_PASSWORD}}}
        - {name: RABBITMQ_USER, valueFrom: {secretKeyRef: {name: ecom-secrets, key: RABBITMQ_USER}}}
        - {name: RABBITMQ_PASSWORD, valueFrom: {secretKeyRef: {name: ecom-secrets, key: RABBITMQ_PASSWORD}}}
        - {name: REDIS_URL, value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"}
        - {name: RABBITMQ_URL, value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/%2F"}
        - {name: AUTH_SERVICE_URL, value: "http://auth-service:3001"}
        - {name: INVOICE_STORAGE_DIR, value: /app/storage/invoices}
        - {name: INVOICE_COMPANY_NAME, value: "Aurelia Commerce Ltd"}
        - {name: INVOICE_COMPANY_ADDRESS, value: "House 42, Road 11, Banani, Dhaka 1213"}
        - {name: INVOICE_COMPANY_EMAIL, value: "billing@aurelia.example"}
        - {name: INVOICE_COMPANY_REGISTRATION, value: "UEN 202400123X"}
        - {name: INVOICE_CURRENCY, value: BDT}
        - {name: INVOICE_TAX_RATE, value: "0"}
        - {name: SHIPPING_FLAT_RATE, value: "120"}
        - {name: FREE_SHIPPING_THRESHOLD, value: "5000"}
        - {name: OUTBOX_POLL_INTERVAL_MS, value: "1000"}
        - {name: OUTBOX_BATCH_SIZE, value: "50"}
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
        - {name: invoices, mountPath: /app/storage/invoices}
        readinessProbe:
          httpGet: {path: /health/ready, port: 3002}
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          httpGet: {path: /health/ready, port: 3002}
          initialDelaySeconds: 90
          periodSeconds: 20
          failureThreshold: 6
        resources:
          requests: {memory: 128Mi}
          limits: {memory: 512Mi}
      volumes:
      - {name: tmp, emptyDir: {}}
      - name: invoices
        persistentVolumeClaim: {claimName: invoice-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: invoice-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
