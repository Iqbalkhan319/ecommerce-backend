apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      containers:
      - name: auth-service
        image: nuruzzaman24x/ecom-auth:1.0
        ports:
        - containerPort: 3001
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        env:
        - {name: SERVICE_NAME, value: auth-service}
        - {name: PORT, value: "3001"}
        - {name: DB_PASS, valueFrom: {secretKeyRef: {name: ecom-secrets, key: AUTH_DB_PASSWORD}}}
        - {name: DATABASE_URL, value: "postgresql://auth_service:$(DB_PASS)@postgres:5432/ecommerce"}
        - {name: DATABASE_POOL_MAX, value: "10"}
        - {name: NODE_ENV, value: production}
        - {name: LOG_LEVEL, value: info}
        - {name: LOG_PRETTY, value: "false"}
        - {name: API_PREFIX, value: api}
        - {name: API_VERSION, value: v1}
        - {name: TRUST_PROXY, value: "true"}
        - {name: BODY_LIMIT, value: 512kb}
        - {name: SWAGGER_ENABLED, value: "false"}
        - {name: CORS_ORIGINS, value: ""}
        - {name: JWT_ISSUER, value: ecom-auth}
        - {name: JWT_AUDIENCE, value: ecom-api}
        - {name: REDIS_KEY_PREFIX, value: ecom}
        - {name: CACHE_ENABLED, value: "true"}
        - {name: RABBITMQ_ENABLED, value: "true"}
        - {name: RUN_MIGRATIONS, value: "true"}
        - {name: RUN_SEED, value: "false"}
        - {name: JWT_PUBLIC_KEY, valueFrom: {secretKeyRef: {name: ecom-secrets, key: JWT_PUBLIC_KEY}}}
        - {name: INTERNAL_API_KEY, valueFrom: {secretKeyRef: {name: ecom-secrets, key: INTERNAL_API_KEY}}}
        - {name: REDIS_PASSWORD, valueFrom: {secretKeyRef: {name: ecom-secrets, key: REDIS_PASSWORD}}}
        - {name: RABBITMQ_USER, valueFrom: {secretKeyRef: {name: ecom-secrets, key: RABBITMQ_USER}}}
        - {name: RABBITMQ_PASSWORD, valueFrom: {secretKeyRef: {name: ecom-secrets, key: RABBITMQ_PASSWORD}}}
        - {name: REDIS_URL, value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"}
        - {name: RABBITMQ_URL, value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/%2F"}
        - {name: JWT_PRIVATE_KEY, valueFrom: {secretKeyRef: {name: ecom-secrets, key: JWT_PRIVATE_KEY}}}
        - {name: ACCESS_TOKEN_TTL_SECONDS, value: "600"}
        - {name: REFRESH_TOKEN_TTL_SECONDS, value: "1209600"}
        - {name: SUPER_ADMIN_EMAIL, valueFrom: {secretKeyRef: {name: ecom-secrets, key: SUPER_ADMIN_EMAIL}}}
        - {name: SUPER_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: ecom-secrets, key: SUPER_ADMIN_PASSWORD}}}
        - {name: SUPER_ADMIN_NAME, value: "Platform Owner"}
        - {name: SUPER_ADMIN_ROTATE_PASSWORD, value: "false"}
        - {name: LOGIN_MAX_ATTEMPTS, value: "8"}
        - {name: LOGIN_LOCKOUT_MINUTES, value: "15"}
        volumeMounts:
        - {name: tmp, mountPath: /tmp}

        readinessProbe:
          httpGet: {path: /health/ready, port: 3001}
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          httpGet: {path: /health/ready, port: 3001}
          initialDelaySeconds: 90
          periodSeconds: 20
          failureThreshold: 6
        resources:
          requests: {memory: 128Mi}
          limits: {memory: 512Mi}
      volumes:
      - {name: tmp, emptyDir: {}}

