apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecom

resources:
  - postgres.yaml
  - redis.yaml
  - rabbitmq.yaml
  - auth.yaml
  - admin.yaml
  - public.yaml
  - kong.yaml
  - redisinsight.yaml
  - ingress.yaml
  - seed-jobs.yaml
  - storageclass.yaml

configMapGenerator:
  - name: kong-config
    files:
      - kong.yml=kong.rendered.yml
  - name: ecom-config
    literals:
      - POSTGRES_DB=ecommerce
      - POSTGRES_USER=ecom_owner
      - NODE_ENV=production
      - LOG_LEVEL=info
      - LOG_PRETTY=false
      - SWAGGER_ENABLED=false
      - REDIS_KEY_PREFIX=ecom
      - CACHE_ENABLED=true
      - RABBITMQ_ENABLED=true
      - JWT_ISSUER=ecom-auth
      - JWT_AUDIENCE=ecom-api
      - RUN_MIGRATIONS=true
      - RUN_SEED=false

generatorOptions:
  disableNameSuffixHash: true
