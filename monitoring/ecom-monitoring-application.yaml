apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecom-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nuruzzaman24x/ecommerce-backend.git
    targetRevision: main
    path: monitoring/ecom
  destination:
    server: https://kubernetes.default.svc
    namespace: ecom
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
