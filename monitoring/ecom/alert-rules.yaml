apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ecom-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: ecom.pods
      rules:
        - alert: EcomPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="ecom"}[15m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} has restarted"
        - alert: EcomPodNotRunning
          expr: kube_pod_status_phase{namespace="ecom",phase=~"Pending|Failed|Unknown"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is stuck in {{ $labels.phase }} state"
        - alert: EcomPodOOMKilled
          expr: kube_pod_container_status_last_terminated_reason{namespace="ecom",reason="OOMKilled"} == 1
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} was OOMKilled after running out of memory"
    - name: ecom.data
      rules:
        - alert: EcomRedisDown
          expr: redis_up == 0 or absent(redis_up)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Redis is down"
        - alert: EcomPostgresDown
          expr: pg_up == 0 or absent(pg_up)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Postgres is down"
        - alert: EcomRabbitMQDown
          expr: absent(rabbitmq_identity_info) or up{namespace="ecom",service="rabbitmq-metrics"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "RabbitMQ is down"
    - name: ecom.gateway
      rules:
        - alert: EcomKongDown
          expr: up{namespace="ecom",service="kong"} == 0 or absent(up{namespace="ecom",service="kong"})
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Kong gateway is down"
        - alert: EcomKongHigh5xx
          expr: sum(rate(kong_http_requests_total{code=~"5.."}[5m])) / sum(rate(kong_http_requests_total[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "More than 5% of requests through Kong are returning 5xx errors"