apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-metrics
  namespace: ecom
  labels:
    app: rabbitmq-metrics
spec:
  selector:
    app: rabbitmq
  ports:
    - name: metrics
      port: 15692
      targetPort: 15692
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rabbitmq
  namespace: ecom
spec:
  selector:
    matchLabels:
      app: rabbitmq-metrics
  namespaceSelector:
    matchNames:
      - ecom
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
